  <div class="container-fluid">
    <!-- Header -->
    <div class="admin-header">
      <div class="container">
        <h1 class="text-center mb-0">
          <i class="bi bi-gear-fill"></i> Trang Quản Trị Sản Phẩm
        </h1>
      </div>
    </div>

    <div class="container">
      <!-- Form Thêm/Sửa Sản Phẩm -->
      <div class="form-container">
        <h3 class="mb-4">
          <i class="bi bi-box-seam"></i> Thông Tin Sản Phẩm
        </h3>
        <form id="productForm">
          <!-- Hidden field để lưu ID khi edit -->
          <input type="hidden" id="productId" />

          <div class="row">
            <!-- Tên sản phẩm -->
            <div class="col-md-6 mb-3">
              <label for="productName" class="form-label">
                <i class="bi bi-tag"></i> Tên sản phẩm <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="productName"
                placeholder="Nhập tên sản phẩm"
                required
              />
            </div>

            <!-- Giá -->
            <div class="col-md-6 mb-3">
              <label for="productPrice" class="form-label">
                <i class="bi bi-currency-dollar"></i> Giá <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                id="productPrice"
                placeholder="Nhập giá sản phẩm"
                min="0"
                step="0.01"
                required
              />
            </div>
          </div>

          <div class="row">
            <!-- Màn hình -->
            <div class="col-md-4 mb-3">
              <label for="productScreen" class="form-label">
                <i class="bi bi-display"></i> Màn hình <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="productScreen"
                placeholder="VD: 6.1 inch"
                required
              />
            </div>

            <!-- Camera sau -->
            <div class="col-md-4 mb-3">
              <label for="productBackCamera" class="form-label">
                <i class="bi bi-camera"></i> Camera sau <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="productBackCamera"
                placeholder="VD: 12MP"
                required
              />
            </div>

            <!-- Camera trước -->
            <div class="col-md-4 mb-3">
              <label for="productFrontCamera" class="form-label">
                <i class="bi bi-camera-video"></i> Camera trước <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="productFrontCamera"
                placeholder="VD: 8MP"
                required
              />
            </div>
          </div>

          <div class="row">
            <!-- Link hình ảnh -->
            <div class="col-md-8 mb-3">
              <label for="productImage" class="form-label">
                <i class="bi bi-image"></i> Link hình ảnh <span class="text-danger">*</span>
              </label>
              <input
                type="url"
                class="form-control"
                id="productImage"
                placeholder="https://example.com/image.jpg"
                required
              />
            </div>

            <!-- Loại sản phẩm -->
            <div class="col-md-4 mb-3">
              <label for="productType" class="form-label">
                <i class="bi bi-list-ul"></i> Loại <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="productType" required>
                <option value="">-- Chọn loại --</option>
                <option value="iphone">iPhone</option>
                <option value="samsung">Samsung</option>
                <option value="other">Khác</option>
              </select>
            </div>
          </div>

          <!-- Mô tả -->
          <div class="mb-3">
            <label for="productDesc" class="form-label">
              <i class="bi bi-card-text"></i> Mô tả <span class="text-danger">*</span>
            </label>
            <textarea
              class="form-control"
              id="productDesc"
              rows="3"
              placeholder="Nhập mô tả sản phẩm"
              required
            ></textarea>
          </div>

          <!-- Buttons -->
          <div class="d-flex gap-2">
            <button type="button" id="addBtn" class="btn btn-primary">
              <i class="bi bi-plus-circle"></i> Thêm sản phẩm
            </button>
            <button type="button" id="updateBtn" class="btn btn-success d-none">
              <i class="bi bi-check-circle"></i> Cập nhật sản phẩm
            </button>
            <button type="reset" class="btn btn-secondary" onclick="location.reload()">
              <i class="bi bi-x-circle"></i> Hủy
            </button>
          </div>
        </form>
      </div>

      <!-- Bảng Danh Sách Sản Phẩm -->
      <div class="table-container">
        <h3 class="mb-4">
          <i class="bi bi-table"></i> Danh Sách Sản Phẩm
        </h3>
        <div class="table-responsive">
          <table class="table table-hover table-bordered align-middle">
            <thead class="table-dark">
              <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá</th>
                <th>Hình ảnh</th>
                <th>Mô tả</th>
                <th style="width: 150px;">Hành động</th>
              </tr>
            </thead>
            <tbody id="productTableBody">
              <tr>
                <td colspan="6" class="text-center">
                  <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Đang tải...</span>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Main JS (imports SCSS) -->
  <script type="module" src="/assets/js/main.js"></script>
  
  <!-- Admin JS Module -->
  <script type="module" src="./admin.js"></script>
</body>
